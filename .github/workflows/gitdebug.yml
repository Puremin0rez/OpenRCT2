name: git-debug
on:
  push:
    branches: [gitdebug]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    name: probe git in the resolute build container
    runs-on: ubuntu-latest
    container: ghcr.io/openrct2/openrct2-build:26-resolute
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Probe
        shell: bash
        run: |
          out=gitdebug/result.txt
          mkdir -p gitdebug
          {
            echo "=== identity / environment ==="
            echo "whoami=$(whoami 2>&1) uid=$(id -u) gid=$(id -g)"
            echo "HOME=$HOME"
            echo "PWD=$PWD"
            echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            echo
            echo "=== ownership of workspace and .git ==="
            stat -c '%u:%g %U:%G  %n' "$PWD" "$PWD/.git" 2>&1 || true
            echo
            echo "=== git version and config ==="
            git --version 2>&1
            echo "global safe.directory:"
            git config --global --get-all safe.directory 2>&1 || echo "(none)"
            echo "system safe.directory:"
            git config --system --get-all safe.directory 2>&1 || echo "(none)"
            echo "gitconfig files:"
            ls -l /root/.gitconfig /github/home/.gitconfig /etc/gitconfig 2>&1 || true
            echo
            echo "=== the three commands from CMakeLists.txt:185-210 ==="
            o=$(git describe HEAD 2>&1); echo "describe    rc=$? out=[$o]"
            o=$(git rev-parse --abbrev-ref HEAD 2>&1); echo "abbrev-ref  rc=$? out=[$o]"
            o=$(git rev-parse --short HEAD 2>&1); echo "short-sha   rc=$? out=[$o]"
            echo
            echo "=== what setenv computes (the env-var path) ==="
            ( . scripts/setenv 2>&1 | sed 's/^/  /' ) || true
            echo
            echo "=== what CMake itself resolves ==="
            cat > /tmp/probe.cmake <<'CM'
          execute_process(COMMAND git describe HEAD COMMAND sed -E "s/-g.+$//"
            WORKING_DIRECTORY ${RD} OUTPUT_VARIABLE T OUTPUT_STRIP_TRAILING_WHITESPACE
            RESULT_VARIABLE RT ERROR_VARIABLE ET)
          execute_process(COMMAND git rev-parse --abbrev-ref HEAD
            WORKING_DIRECTORY ${RD} OUTPUT_VARIABLE B OUTPUT_STRIP_TRAILING_WHITESPACE
            RESULT_VARIABLE RB ERROR_VARIABLE EB)
          execute_process(COMMAND git rev-parse --short HEAD
            WORKING_DIRECTORY ${RD} OUTPUT_VARIABLE S OUTPUT_STRIP_TRAILING_WHITESPACE
            RESULT_VARIABLE RS ERROR_VARIABLE ES)
          message(STATUS "VERSION_TAG=[${T}] rc=${RT} err=[${ET}]")
          message(STATUS "BRANCH=[${B}] rc=${RB} err=[${EB}]")
          message(STATUS "SHA1_SHORT=[${S}] rc=${RS} err=[${ES}]")
          CM
            cmake -DRD="$PWD" -P /tmp/probe.cmake 2>&1 | sed 's/^/  /'
          } > "$out" 2>&1
          cat "$out"

      - name: Commit the result back
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD" || true
          git config user.name  "git-debug bot"
          git config user.email "noreply@example.com"
          git add -f gitdebug/result.txt
          git commit -m "git-debug: probe output" || echo "nothing to commit"
          git push origin HEAD:gitdebug
