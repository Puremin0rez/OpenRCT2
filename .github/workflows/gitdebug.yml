name: git-debug
on:
  push:
    branches: [gitdebug]
  workflow_dispatch:

permissions:
  contents: write

# Mirrors the workflow-level env of the real ci.yml
env:
  OPENRCT2_BUILD_SERVER: GitHub
  OPENRCT2_VERSION: 0.5.5

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ubuntu-latest
    container: ghcr.io/openrct2/openrct2-build:26-resolute
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: without-fix
            apply_fix: 'no'
          - label: with-fix
            apply_fix: 'yes'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # THE FIX UNDER TEST - byte-identical to ci.yml:142's existing step
      - name: Apply safe.directory fix
        if: matrix.apply_fix == 'yes'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and verify
        shell: bash
        run: |
          set +e
          mkdir -p gitdebug
          out="gitdebug/result-${{ matrix.label }}.txt"
          {
            echo "### label=${{ matrix.label }} apply_fix=${{ matrix.apply_fix }}"
            echo "### GITHUB_SHA=$GITHUB_SHA"
            echo
            echo "--- git as CMake will invoke it ---"
            o=$(git describe HEAD 2>&1);               echo "describe    rc=$? out=[$o]"
            o=$(git rev-parse --abbrev-ref HEAD 2>&1); echo "abbrev-ref  rc=$? out=[$o]"
            o=$(git rev-parse --short HEAD 2>&1);      echo "short-sha   rc=$? out=[$o]"
            echo
            echo "--- building (discord-rpc disabled; irrelevant to this test) ---"
            ( . scripts/setenv -q; set +e; \
              build -DWITH_TESTS=off -DDISABLE_DISCORD_RPC=ON -DCMAKE_BUILD_TYPE=Release \
                    -DBUILD_SHARED_LIBS=ON -DPORTABLE=ON \
                    -DCMAKE_POSITION_INDEPENDENT_CODE=on -DCMAKE_CXX_FLAGS="-g1 -gz" ) \
              > /tmp/build.log 2>&1
            echo "build rc=$?"
            echo "--- last 25 lines of build log ---"
            tail -25 /tmp/build.log
            echo
            BIN=$(find . -type f -name 'openrct2' -perm -u+x 2>/dev/null | head -1)
            LIB=$(find . -type f -name 'libopenrct2.so*' 2>/dev/null | head -1)
            echo "binary=[$BIN] lib=[$LIB]"
            echo
            echo "--- embedded version string ---"
            { strings -n 6 "$BIN" 2>/dev/null; strings -n 6 "$LIB" 2>/dev/null; } \
              | grep -E "^OpenRCT2, v" | sort -u
            echo
            echo "--- runtime --version ---"
            [ -n "$BIN" ] && "$BIN" --version 2>&1 | head -3
            echo
            SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
            n=$( { strings -n 4 "$BIN" 2>/dev/null; strings -n 4 "$LIB" 2>/dev/null; } | grep -cF "$SHORT")
            echo "short-sha ($SHORT) occurrences in binary: $n"
          } > "$out" 2>&1
          cat "$out"
          exit 0

      - name: Publish result to its own branch
        if: always()
        shell: bash
        run: |
          set +e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "git-debug bot"; git config user.email "noreply@example.com"
          git add -f "gitdebug/result-${{ matrix.label }}.txt"
          git commit -m "result: ${{ matrix.label }}"
          git push -f origin HEAD:refs/heads/result-${{ matrix.label }}
          exit 0
